<!doctype html>
<!--
  Permission tutorial scenes. One 360x640 frame: a caption banner on top, a mock Android Settings screen below.
  Rendered by render.mjs (setLang(code) -> narration lines -> TTS per step -> setup(id, speechSecs) -> seek(ms) per frame).
  Translations live in strings.js, keyed by the English text.
  Time comes only from seek(): no timers, no CSS animations.
-->
<html>
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 360px; height: 640px; overflow: hidden; background: #1C352B;
    font-family: "Roboto", "Google Sans", -apple-system, "Helvetica Neue", Arial, "PingFang SC", "Kohinoor Devanagari",
      "Devanagari Sangam MN", "Geeza Pro", "SF Arabic", sans-serif; }
  html:not([lang=en]):not([lang=es]) #chip { letter-spacing: 0; } /* spacing breaks Arabic joining and Devanagari */
  #banner { position: absolute; left: 0; top: 0; width: 360px; height: 132px; padding: 14px 18px; color: #fff; background: #1C352B; }
  #chip { font-size: 13px; font-weight: 700; letter-spacing: .12em; color: #A8C9B2; }
  #caption { margin-top: 6px; font-size: 25px; line-height: 1.16; font-weight: 700; }
  #phone { position: absolute; left: 0; top: 132px; width: 360px; height: 508px; background: #F6F8FB; overflow: hidden;
    border-radius: 18px 18px 0 0; }
  #screen { position: absolute; inset: 0; }
  .bar { height: 60px; display: flex; align-items: center; padding: 0 12px; gap: 14px; }
  .bar .back { font-size: 26px; color: #333; width: 28px; }
  .bar .title { font-size: 22px; color: #1b1b1f; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .bar .kebab { font-size: 26px; color: #333; width: 32px; text-align: center; border-radius: 16px; line-height: 32px; }
  .list { position: absolute; left: 0; right: 0; top: 60px; bottom: 0; overflow: hidden; }
  .h { font-size: 14px; font-weight: 600; color: #1a73e8; padding: 14px 20px 6px; }
  .row { display: flex; align-items: center; gap: 16px; padding: 0 20px; min-height: 68px; border-radius: 14px; margin: 0 6px; }
  .row .ic { width: 38px; height: 38px; border-radius: 50%; flex: none; display: grid; place-items: center;
    color: #fff; font-weight: 700; font-size: 17px; }
  .row .tx { flex: 1; }
  .row .t { font-size: 18px; color: #1b1b1f; }
  .row .s { font-size: 14px; color: #5f6368; margin-top: 2px; }
  .rg { background: #2F6F4E; }
  .tog { width: 52px; height: 32px; border-radius: 16px; background: #E0E2EC; border: 2px solid #74777F; position: relative; flex: none; }
  .tog::after { content: ""; position: absolute; top: 6px; inset-inline-start: 6px; width: 16px; height: 16px; border-radius: 50%; background: #74777F; }
  .tog.on { background: #1a73e8; border-color: #1a73e8; }
  .tog.on::after { inset-inline-start: 22px; top: 2px; width: 24px; height: 24px; background: #fff; }
  .row.disabled .t, .row.disabled .s { color: #a9abb0; }
  .row.disabled .tog { opacity: .38; }
  .text { font-size: 14px; color: #5f6368; padding: 10px 26px; line-height: 1.4; }
  .appheader { text-align: center; padding: 10px 0 6px; }
  .appheader .ic { width: 64px; height: 64px; border-radius: 50%; margin: 0 auto 8px; display: grid; place-items: center;
    color: #fff; font-weight: 700; font-size: 28px; }
  .appheader .t { font-size: 22px; color: #1b1b1f; }
  .buttons { display: flex; justify-content: space-around; padding: 10px 20px 14px; }
  .buttons div { text-align: center; font-size: 13px; color: #1b1b1f; }
  .buttons div b { display: block; width: 44px; height: 44px; margin: 0 auto 4px; border-radius: 50%; background: #DCE5F5; }
  .scrim { position: absolute; inset: 0; background: rgba(0,0,0,.32); }
  .dialog { position: absolute; left: 22px; right: 22px; top: 120px; background: #fff; border-radius: 26px; padding: 22px 22px 14px; }
  .dialog .dt { font-size: 20px; color: #1b1b1f; line-height: 1.25; }
  .dialog .db { font-size: 14px; color: #44474e; margin-top: 12px; line-height: 1.4; }
  .dialog .btns { display: flex; justify-content: flex-end; gap: 6px; margin-top: 16px; }
  .dialog .btns span { font-size: 16px; font-weight: 600; color: #1a73e8; padding: 10px 12px; border-radius: 18px; }
  .menu { position: absolute; inset-inline-end: 10px; top: 14px; background: #fff; border-radius: 6px; padding: 8px 0;
    box-shadow: 0 6px 22px rgba(0,0,0,.25); }
  .menu span { display: block; font-size: 17px; color: #1b1b1f; padding: 14px 22px; }
  .pin { position: absolute; inset: 0; background: #fff; text-align: center; padding-top: 60px; }
  .pin .dt { font-size: 22px; color: #1b1b1f; }
  .pin .db { font-size: 15px; color: #5f6368; margin-top: 10px; }
  .pin .dots { margin-top: 34px; font-size: 30px; letter-spacing: 14px; color: #1b1b1f; }
  .pin .fp { width: 74px; height: 74px; border-radius: 50%; border: 3px solid #1a73e8; margin: 40px auto 0; display: grid;
    place-items: center; font-size: 38px; color: #1a73e8; }
  .done { position: absolute; inset: 0; display: grid; place-items: center; background: rgba(246,248,251,.55); }
  .done b { width: 120px; height: 120px; border-radius: 50%; background: #2F6F4E; color: #fff; font-size: 70px; display: grid; place-items: center; }
  .target { outline: 3px solid #2F6F4E; outline-offset: -3px; }
  #finger { position: absolute; width: 46px; height: 46px; margin: -23px 0 0 -23px; border-radius: 50%; left: 0; top: 0;
    background: rgba(40,40,40,.32); border: 3px solid #fff; box-shadow: 0 2px 10px rgba(0,0,0,.35); opacity: 0; }
  #ripple { position: absolute; border-radius: 50%; border: 4px solid #2F6F4E; left: 0; top: 0; opacity: 0; }
</style>
</head>
<body>
<div id="banner"><div id="chip"></div><div id="caption"></div></div>
<div id="phone"><div id="screen"></div></div>
<div id="ripple"></div>
<div id="finger"></div>
<script src="strings.js"></script>
<script>
// ---------- Language ----------
// setLang(code) before setup(): every label, caption and narration line goes through L(), keyed by its English text.
let LANG = "en", RTL = false;
const KEEP = new Set(["", "RotGuard", "TalkBack", "Chrome", "Google", "YouTube"]); // names Android never translates
function L(s) {
  if (LANG === "en" || s == null || KEEP.has(s)) return s;
  const t = STRINGS[LANG]?.[s];
  if (t == null) throw new Error(`no ${LANG} text for: ${s}`);
  return t;
}
function setLang(code) {
  if (code !== "en" && !STRINGS[code]) throw new Error(`unknown language ${code}`);
  LANG = code; RTL = code === "ar";
  document.documentElement.lang = code;
  document.documentElement.dir = RTL ? "rtl" : "ltr";
  shown = -1;
  return Object.fromEntries(Object.entries(VARIANTS).map(([k, v]) => [k, v.map(s => L(s.say))]));
}

// ---------- Content ----------
// Screens: rows are [kind, ...]. Ids mark tap targets.
const RG = ["app", "RotGuard", "Off", "rg"];
const SCREENS = {
  a11y: { title: "Accessibility", rows: [["h", "Downloaded apps"], RG, ["h", "Screen readers"], ["item", "Select to Speak", "Off"],
    ["item", "TalkBack", "Off"], ["h", "Display"], ["item", "Display size and text", ""], ["item", "Color and motion", ""]] },
  a11yLegacy: { title: "Accessibility", rows: [["h", "Downloaded services"], RG, ["h", "Screen readers"], ["item", "Select to Speak", "Off"],
    ["item", "TalkBack", "Off"], ["h", "Display"], ["item", "Font size", "Default"], ["item", "Display size", "Default"]] },
  a11yDetail: { title: "RotGuard", rows: [["toggle", "Use RotGuard", "tg"], ["toggle", "RotGuard shortcut", "sc"],
    ["text", "Detects when you open guarded apps like YouTube so RotGuard can show a press-and-hold shield. Never reads screen contents or messages."]] },
  a11yDetailLegacy: { title: "RotGuard", rows: [["toggle", "Use service", "tg"],
    ["text", "Detects when you open guarded apps like YouTube so RotGuard can show a press-and-hold shield. Never reads screen contents or messages."]] },
  appInfo: { title: "App info", kebab: true, rows: [["appheader", "RotGuard"], ["buttons"], ["item", "Notifications", "On"],
    ["item", "Permissions", "No permissions requested"], ["item", "Storage & cache", "24 MB used"], ["item", "Screen time", ""]] },
  overlayApp: { title: "Display over other apps", rows: [["appheader", "RotGuard"], ["toggle", "Allow display over other apps", "tg"],
    ["text", "Allow this app to display on top of other apps you're using. This app will be able to see where you tap or change what's displayed on the screen."]] },
  overlayList: { title: "Display over other apps", rows: [["app2", "Calendar", "Not allowed"], ["app2", "Chrome", "Not allowed"],
    ["app2", "Clock", "Not allowed"], ["app2", "Google", "Allowed"], ["app2", "Maps", "Allowed"], ["app2", "Messages", "Allowed"],
    ["app2", "Phone", "Allowed"], ["app", "RotGuard", "Not allowed", "rg"], ["app2", "YouTube", "Not allowed"]] },
  usageList: { title: "Usage access", rows: [["app2", "Android System Intelligence", "Permitted"], ["app2", "Digital Wellbeing", "Permitted"],
    ["app2", "Google Play services", "Permitted"], ["app", "RotGuard", "Not permitted", "rg"], ["app2", "Settings", "Permitted"]] },
  usageListV36: { title: "App usage data", rows: [["app2", "Digital Wellbeing", "Allowed"], ["app2", "Google", "Allowed"],
    ["app2", "Google Play services", "Allowed"], ["app2", "Google Play Store", "Allowed"], ["app", "RotGuard", "Not allowed", "rg"]] },
  usageAppV36: { title: "App usage data", rows: [["appheader", "RotGuard"], ["toggle", "Permit access to app usage data", "tg"],
    ["text", "App usage data allows an app to track what other apps you're using and how often, as well as your carrier, language settings, and other details."]] },
  usageApp: { title: "Usage access", rows: [["appheader", "RotGuard"], ["toggle", "Permit usage access", "tg"],
    ["text", "Usage access allows an app to track what other apps you're using and how often, as well as your carrier, language settings and other details."]] },
};

const DONE = { done: true, caption: "Done! RotGuard reopens by itself", say: "That's it! The switch is on, and RotGuard will open again on its own." };
const FULL_CONTROL = { title: "Allow RotGuard to have full control of your device?",
  body: "Full control is appropriate for apps that help you with accessibility needs, but not for most apps.", buttons: ["Deny", "Allow"], tap: "Allow" };

// Steps: screen, caption (banner), say (narration), tap (row id, dialog button text, or "kebab"/menu item),
// on: toggle ids drawn on, scroll: px the list scrolls up first, dialog/menu/pin/done: overlays.
const VARIANTS = {
  // Android 11+
  tutorial_accessibility: [
    { screen: "a11y", caption: "Tap RotGuard under Downloaded apps", tap: "rg",
      say: "Let's turn on RotGuard's accessibility service. Under Downloaded apps, tap RotGuard. On some phones, this section is called Installed apps, near the bottom." },
    { screen: "a11yDetail", caption: "Turn on Use RotGuard", tap: "tg", say: "Now turn on the Use RotGuard switch." },
    { screen: "a11yDetail", caption: "Tap Allow", dialog: FULL_CONTROL, say: "Android asks you to confirm. Tap Allow." },
    { screen: "a11yDetail", on: ["tg"], ...DONE },
  ],
  // Android 8 to 10
  tutorial_accessibility_legacy: [
    { screen: "a11yLegacy", caption: "Tap RotGuard under Downloaded services", tap: "rg",
      say: "Let's turn on RotGuard's accessibility service. Under Downloaded services, tap RotGuard. On some phones, this section is called Installed services, near the bottom." },
    { screen: "a11yDetailLegacy", caption: "Turn on the switch", tap: "tg", say: "Turn on the switch at the top." },
    { screen: "a11yDetailLegacy", caption: "Tap OK", dialog: { title: "Use RotGuard?",
      body: "RotGuard needs to: Observe your actions. Receive notifications when you're interacting with an app.", buttons: ["Cancel", "OK"], tap: "OK" },
      say: "Confirm by tapping OK." },
    { screen: "a11yDetailLegacy", on: ["tg"], ...DONE },
  ],
  // Android 13+, app installed from a file: the switch starts locked ("Restricted setting").
  tutorial_accessibility_restricted: [
    { screen: "a11y", caption: "Tap RotGuard under Downloaded apps", tap: "rg",
      say: "Let's turn on RotGuard's accessibility service. Under Downloaded apps, tap RotGuard. On some phones, it's under Installed apps." },
    { screen: "a11yDetail", disabled: ["tg"], caption: "Tap the greyed-out switch", tap: "tg",
      say: "Because RotGuard wasn't installed from an app store, Android locks this switch at first. Tap it anyway." },
    { screen: "a11yDetail", disabled: ["tg"], caption: "Tap OK", dialog: { title: "Restricted setting",
      body: "For your security, this setting is currently unavailable.", buttons: ["Learn more", "OK"], tap: "OK" },
      say: "A Restricted setting message appears. Tap OK." },
    { screen: "a11yDetail", disabled: ["tg"], caption: "Go back to RotGuard and tap Enable again",
      say: "Now go back to RotGuard and tap the enable button again. We'll show you how to unlock the switch." },
  ],
  // Android 13+, second half of the restricted flow: App info > menu > Allow restricted settings.
  tutorial_accessibility_unlock: [
    { screen: "appInfo", caption: "Tap ⋮ in the top corner", tap: "kebab",
      say: "This is RotGuard's App info page. Tap the three dots in the top right corner." },
    { screen: "appInfo", caption: "Tap Allow restricted settings", menu: { items: ["Allow restricted settings"], tap: "Allow restricted settings" },
      say: "Tap Allow restricted settings." },
    { screen: "appInfo", caption: "Confirm it's you", pin: true, say: "Confirm with your PIN, pattern, or fingerprint." },
    { screen: "appInfo", caption: "Go back to RotGuard and tap Enable again",
      say: "Unlocked! Go back to RotGuard and tap the enable button once more. This time the switch will work." },
  ],
  // Android 8 to 10: the intent opens RotGuard's own page.
  tutorial_overlay_legacy: [
    { screen: "overlayApp", caption: "Turn on Allow display over other apps", tap: "tg",
      say: "RotGuard needs to show its shield on top of other apps. Turn on Allow display over other apps." },
    { screen: "overlayApp", on: ["tg"], ...DONE },
  ],
  // Android 11+: the intent opens the list of all apps.
  tutorial_overlay: [
    { screen: "overlayList", caption: "Find and tap RotGuard", tap: "rg", scroll: 150,
      say: "RotGuard needs to show its shield on top of other apps. Scroll down the list and tap RotGuard." },
    { screen: "overlayApp", caption: "Turn on Allow display over other apps", tap: "tg", say: "Turn on Allow display over other apps." },
    { screen: "overlayApp", on: ["tg"], ...DONE },
  ],
  // Android 16+: the page is renamed "App usage data".
  tutorial_usage_access: [
    { screen: "usageListV36", caption: "Tap RotGuard", tap: "rg",
      say: "Usage access lets RotGuard show how much time you spend in each app. Find RotGuard in the list and tap it." },
    { screen: "usageAppV36", caption: "Turn on Permit access to app usage data", tap: "tg",
      say: "Turn on Permit access to app usage data." },
    { screen: "usageAppV36", on: ["tg"], ...DONE },
  ],
  // Android 8 to 15
  tutorial_usage_access_legacy: [
    { screen: "usageList", caption: "Tap RotGuard", tap: "rg",
      say: "Usage access lets RotGuard show how much time you spend in each app. Find RotGuard in the list and tap it." },
    { screen: "usageApp", caption: "Turn on Permit usage access", tap: "tg", say: "Turn on Permit usage access." },
    { screen: "usageApp", on: ["tg"], ...DONE },
  ],
};

// ---------- Rendering ----------
const COLORS = ["#4285F4", "#EA4335", "#FBBC04", "#34A853", "#A142F4", "#F06292", "#00897B"];
const $ = s => document.querySelector(s);
const ease = x => x <= 0 ? 0 : x >= 1 ? 1 : x * x * (3 - 2 * x);
const icon = (name, cls = "") => `<div class="ic ${cls}" style="${cls ? "" : `background:${COLORS[name.length % COLORS.length]}`}">${name[0]}</div>`;

function rowHtml(r, step) {
  const [kind, a0, b0, id] = r;
  const a = L(a0), b = kind === "toggle" ? b0 : L(b0);
  switch (kind) {
    case "h": return `<div class="h">${a}</div>`;
    case "app": return `<div class="row" data-id="${id}">${icon(a, "rg")}<div class="tx"><div class="t">${a}</div><div class="s">${b}</div></div></div>`;
    case "app2": return `<div class="row">${icon(a)}<div class="tx"><div class="t">${a}</div><div class="s">${b}</div></div></div>`;
    case "item": return `<div class="row">${icon(a)}<div class="tx"><div class="t">${a}</div>${b ? `<div class="s">${b}</div>` : ""}</div></div>`;
    case "toggle": {
      const on = (step.on || []).includes(b), off = (step.disabled || []).includes(b);
      return `<div class="row${off ? " disabled" : ""}" data-id="${b}"><div class="tx"><div class="t">${a}</div></div><div class="tog${on ? " on" : ""}"></div></div>`;
    }
    case "text": return `<div class="text">${a}</div>`;
    case "appheader": return `<div class="appheader">${icon(a, "rg")}<div class="t">${a}</div></div>`;
    case "buttons": return `<div class="buttons"><div><b></b>${L("Open")}</div><div><b></b>${L("Uninstall")}</div><div><b></b>${L("Force stop")}</div></div>`;
  }
  throw new Error(`unknown row kind ${kind}`);
}

function buildStep(step) {
  const sc = SCREENS[step.screen];
  if (!sc) throw new Error(`unknown screen ${step.screen}`);
  let html = `<div class="bar"><span class="back">${RTL ? "→" : "←"}</span><span class="title">${L(sc.title)}</span>${sc.kebab ? `<span class="kebab" data-id="kebab">⋮</span>` : ""}</div>
    <div class="list"><div class="inner">${sc.rows.map(r => rowHtml(r, step)).join("")}</div></div>`;
  if (step.dialog) html += `<div class="scrim"></div><div class="dialog"><div class="dt">${L(step.dialog.title)}</div><div class="db">${L(step.dialog.body)}</div>
    <div class="btns">${step.dialog.buttons.map(b => `<span data-id="${b}">${L(b)}</span>`).join("")}</div></div>`;
  if (step.menu) html += `<div class="menu">${step.menu.items.map(i => `<span data-id="${i}">${L(i)}</span>`).join("")}</div>`;
  if (step.pin) html += `<div class="pin"><div class="dt">${L("Confirm it's you")}</div><div class="db">${L("Enter your PIN or use your fingerprint")}</div>
    <div class="dots">● ● ● ○</div><div class="fp">◉</div></div>`;
  if (step.done) html += `<div class="done"><b>✓</b></div>`;
  return html;
}

const tapIdOf = step => step.tap || step.dialog?.tap || step.menu?.tap || null;

let PLAN = null, shown = -1;
const LEAD = 0.4, TAIL_AFTER_TAP = 0.75, TAIL_NO_TAP = 1.3, MIN_STEP = 2.6;

// speech: seconds of narration per step (null = no clip). Returns the timeline the renderer needs.
function setup(id, speech) {
  const steps = VARIANTS[id];
  if (!steps) throw new Error(`unknown variant ${id}`);
  let t = 0;
  PLAN = { id, steps: steps.map((s, i) => {
    const sp = speech?.[i] ?? 2;
    const tapAt = tapIdOf(s) ? LEAD + sp + 0.15 : null;
    const dur = Math.max(MIN_STEP, tapAt != null ? tapAt + TAIL_AFTER_TAP : LEAD + sp + TAIL_NO_TAP);
    const out = { ...s, start: t, dur, tapAt };
    t += dur;
    return out;
  }) };
  PLAN.duration = t;
  shown = -1;
  return { duration: t, steps: PLAN.steps.map(s => ({ start: s.start, dur: s.dur })) };
}

function seek(ms) {
  const t = ms / 1000;
  const steps = PLAN.steps;
  let i = steps.findIndex(s => t < s.start + s.dur);
  if (i < 0) i = steps.length - 1;
  const step = steps[i], lt = t - step.start;
  if (i !== shown) {
    $("#screen").innerHTML = buildStep(step);
    const title = $(".bar .title"); // long translated titles shrink to one line, like the real collapsed toolbar
    for (let fs = 22; fs >= 15 && title.scrollWidth > title.clientWidth; fs--) title.style.fontSize = `${fs - 1}px`;
    $("#chip").textContent = step.done ? L("ALL SET")
      : L("STEP {n} OF {m}").replace("{n}", i + 1).replace("{m}", steps.filter(s => !s.done).length);
    const cap = $("#caption");
    cap.textContent = L(step.caption);
    // longer translations shrink to fit the banner instead of spilling onto the phone
    for (let fs = 25; fs >= 15; fs--) { cap.style.fontSize = `${fs}px`; if ($("#banner").scrollHeight <= 132) break; }
    shown = i;
  }
  // new base screen fades in; overlays on the same screen fade in on their own
  const sameBase = i > 0 && steps[i - 1].screen === step.screen;
  const fade = ease(lt / 0.25);
  $("#screen").style.opacity = sameBase ? 1 : fade;
  for (const el of document.querySelectorAll(".scrim,.dialog,.menu,.pin,.done")) el.style.opacity = fade;

  const list = $(".list .inner");
  if (list && step.scroll) list.style.transform = `translateY(${-step.scroll * ease((lt - 0.4) / 0.9)}px)`;

  const finger = $("#finger"), ripple = $("#ripple");
  finger.style.opacity = 0; ripple.style.opacity = 0;
  for (const el of document.querySelectorAll(".target")) el.classList.remove("target");
  const tid = tapIdOf(step);
  if (!tid) return;
  const target = document.querySelector(`[data-id="${CSS.escape(tid)}"]`);
  if (!target) throw new Error(`no tap target ${tid} in ${PLAN.id}`);
  const r = (target.querySelector(".tog") || target).getBoundingClientRect(); // toggles: aim at the switch
  const inset = Math.min(r.width * 0.72, r.width - 40); // same spot from the reading-start edge, mirrored for RTL
  const tx = target.classList.contains("row") ? (RTL ? r.right - inset : r.left + inset) : r.left + r.width / 2;
  const ty = r.top + r.height / 2;
  const moveStart = Math.max(0.5, step.tapAt - 1.5), moveEnd = step.tapAt - 0.25;
  if (lt < moveStart - 0.2) return;
  const k = ease((lt - moveStart) / (moveEnd - moveStart));
  const sx = RTL ? 110 : 250, sy = 600;
  finger.style.left = `${sx + (tx - sx) * k}px`;
  finger.style.top = `${sy + (ty - sy) * k}px`;
  finger.style.opacity = Math.min(1, (lt - (moveStart - 0.2)) / 0.2);
  const press = lt >= step.tapAt && lt < step.tapAt + 0.2;
  finger.style.transform = press ? "scale(.82)" : "scale(1)";
  if (lt > step.tapAt - 1.2) target.classList.add("target");
  if (lt >= step.tapAt) {
    const p = Math.min(1, (lt - step.tapAt) / 0.5), size = 30 + 60 * p;
    Object.assign(ripple.style, { width: `${size}px`, height: `${size}px`, left: `${tx - size / 2}px`, top: `${ty - size / 2}px`, opacity: 1 - p });
  }
}

window.VARIANTS = VARIANTS; window.setup = setup; window.seek = seek; window.setLang = setLang;
</script>
</body>
</html>
